name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Khairat-Masjid-Tengah-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Khairat-Masjid-Tengah-Android-v1.0.0
          path: android/app/build/outputs/apk/debug/Khairat-Masjid-Tengah-v1.0.0.apk
          retention-days: 30
